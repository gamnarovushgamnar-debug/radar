services:
  - type: web
    name: radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: NTFY_TOPIC
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FREE_AI
        value: "1"
      # Ключ для push-тривог. Після першого запуску скопіюйте VAPID_PEM з логів Render сюди,
      # інакше після кожного перезапуску ключ зміниться й підписки доведеться оновлювати.
      - key: VAPID_PEM
        sync: false
      - key: VAPID_SUB
        value: "mailto:you@example.com"
