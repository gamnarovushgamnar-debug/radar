<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Радар цілей</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0b0f14">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;background:#0b0f14;color:#e6edf3;font:14px system-ui,sans-serif}
#m{position:absolute;inset:0 0 38% 0}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
#p{position:absolute;left:0;right:0;bottom:0;height:38%;overflow:auto;background:#111820;border-top:1px solid #243040;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.r{padding:6px 0;border-bottom:1px solid #1c2733}.r b{font-size:15px}.r small{color:#8b9bb0;display:block}
.kab{color:#ff5a5a}.drone{color:#fbbf24}.missile{color:#fb923c}.aircraft{color:#60a5fa}
.ic{font-size:22px;text-shadow:0 0 4px #000;text-align:center;line-height:24px}
#bar{position:absolute;z-index:999;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center}
button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:14px}
#st{background:#000a;padding:6px 9px;border-radius:8px}
#al{position:absolute;z-index:1000;inset:0;display:none;background:#b00020ee;color:#fff;font-size:26px;font-weight:700;text-align:center;padding:30% 20px}
</style></head><body>
<div id="m"></div>
<div id="bar"><button id="en">🔔 Увімкнути сирену</button><span id="st">з'єднання…</span></div>
<div id="p"></div>
<div id="al" onclick="stopAlarm()"></div>
<script>
const ICON={drone:'🛸',kab:'💣',missile:'🚀',aircraft:'✈️'},NAME={drone:'БпЛА',kab:'КАБ',missile:'Ракета',aircraft:'Борт'},
COL={drone:'#fbbf24',kab:'#ff5a5a',missile:'#fb923c',aircraft:'#60a5fa'};
const map=L.map('m',{zoomControl:false}).setView([47.6,35.4],8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const objs={};let homeMk,actx,alarmT,wake;

function fmt(s){return s==null?'—':s>=60?Math.floor(s/60)+' хв '+s%60+' с':s+' с'}
function render(d){
  if(!homeMk)homeMk=L.circleMarker([d.home[1],d.home[2]],{radius:7,color:'#3fb950',fillOpacity:.9}).addTo(map).bindTooltip(d.home[0]);
  const alive=new Set(d.tracks.map(t=>t.id));
  for(const id in objs)if(!alive.has(+id)){map.removeLayer(objs[id].g);delete objs[id]}
  d.tracks.sort((a,b)=>(a.kind=='kab'?0:1)-(b.kind=='kab'?0:1)||(a.eta??1e9)-(b.eta??1e9));
  d.tracks.forEach(t=>{
    let o=objs[t.id];const p=[t.lat,t.lon];
    if(!o){o={g:L.layerGroup().addTo(map),
      mk:L.marker(p,{icon:L.divIcon({className:'',html:`<div class="ic">${ICON[t.kind]}</div>`,iconSize:[24,24]})}),
      ln:L.polyline([],{color:COL[t.kind],dashArray:'6 6',weight:2}),
      tr:L.polyline([[t.o[0],t.o[1]],p],{color:COL[t.kind],weight:2,opacity:.5})};
      o.g.addLayer(o.tr).addLayer(o.ln).addLayer(o.mk);objs[t.id]=o}
    o.mk.setLatLng(p);o.ln.setLatLngs([p,t.goal]);o.tr.setLatLngs([[t.o[0],t.o[1]],p]);
    o.mk.bindTooltip(`${NAME[t.kind]}${t.alt!=null?' '+t.alt+' м':''}`);
  });
  document.getElementById('p').innerHTML=d.tracks.map(t=>`<div class="r"><b class="${t.kind}">${ICON[t.kind]} ${NAME[t.kind]}</b> ${t.frm} → ${t.to}${t.short?' (не долетить)':''}
  <small>${t.v?t.v+' км/год · курс '+t.hdg+'° · ':''}${t.alt!=null?'висота ~'+t.alt+' м · ':''}до ${d.home[0]}: ${t.home} км${t.eta!=null?' · ~'+fmt(t.eta):''} · звіт ${t.age} с тому</small>
  <small>${t.text}</small></div>`).join('')||'<div class="r">Цілей немає</div>';
}
function beep(){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=900;
  o.connect(g);g.connect(actx.destination);g.gain.value=.4;o.start();o.frequency.setValueAtTime(600,actx.currentTime+.25);o.stop(actx.currentTime+.5)}
function alarm(a){
  const el=document.getElementById('al');el.style.display='block';el.innerHTML='⚠️ '+a.text+'<br><small>торкніться щоб вимкнути</small>';
  clearInterval(alarmT);beep();alarmT=setInterval(beep,700);
  if(navigator.vibrate)navigator.vibrate([500,200,500,200,800]);
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Увага! КАБ летить на Запоріжжя. '+(a.lvl==2?'Негайно в укриття!':''));u.lang='uk-UA';u.rate=1.05;speechSynthesis.speak(u);
  if(Notification.permission=='granted')new Notification('КАБ на Запоріжжя',{body:a.text,requireInteraction:true});
}
function stopAlarm(){clearInterval(alarmT);speechSynthesis.cancel();document.getElementById('al').style.display='none'}
document.getElementById('en').onclick=async e=>{
  actx=new (window.AudioContext||window.webkitAudioContext)();beep();
  speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
  if('Notification' in window)Notification.requestPermission();
  try{wake=await navigator.wakeLock.request('screen')}catch(_){}
  e.target.textContent='🔔 Сирена увімкнена'};
function connect(){
  const es=new EventSource('/events');
  es.onopen=()=>st.textContent='● онлайн';
  es.onmessage=e=>{const d=JSON.parse(e.data);st.textContent='● онлайн · цілей: '+d.tracks.length;render(d)};
  es.addEventListener('alert',e=>alarm(JSON.parse(e.data)));
  es.onerror=()=>st.textContent='✖ немає зв\'язку…';
}
connect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
