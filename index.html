<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЄРадар · Запоріжжя</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0b0f17">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{
 --bg:#0b0f17;--p:#111722ee;--p2:#171f2e;--l:#232e42;--t:#e6edf3;--m:#8b949e;
 --ac:#388bfd;--gn:#2ea043;--am:#d29922;--rd:#f85149;--sh:42%
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
#m{position:absolute;inset:0 0 var(--sh) 0;transition:bottom .2s ease}
.leaflet-container{background:#090d14}
.leaflet-layer.dk{filter:invert(1) hue-rotate(185deg) saturate(.6) brightness(.62) contrast(1.05)}
.leaflet-layer.oled{filter:invert(1) hue-rotate(180deg) grayscale(.8) brightness(.45) contrast(1.3)}
.leaflet-layer.st{filter:saturate(.7) brightness(.58) contrast(1.05)}
.leaflet-control-attribution{background:#0b0f17aa!important;color:#556!important;font-size:10px!important}.leaflet-control-attribution a{color:#667!important}

/* ВЕРХНІЙ ТАКТИЧНИЙ HUD (ЯК У DRONE ALERTS / DIMAP) */
#hud{position:absolute;z-index:900;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
#ban{
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:10px 14px;border-radius:14px;background:rgba(16,38,24,.88);
 backdrop-filter:blur(12px);border:1px solid rgba(46,160,67,.45);
 box-shadow:0 8px 24px rgba(0,0,0,.45);font-weight:600;font-size:13.5px
}
#ban.am{background:rgba(48,36,12,.9);border-color:rgba(210,153,34,.55);color:#ffd885}
#ban.rd{background:rgba(62,16,20,.92);border-color:rgba(248,81,73,.75);color:#ffaca6;animation:bl 1s infinite}
@keyframes bl{50%{background:rgba(98,22,28,.95);box-shadow:0 0 25px rgba(248,81,73,.45)}}
#clock{font:600 12px monospace;opacity:.85;white-space:nowrap;padding-left:8px;border-left:1px solid rgba(255,255,255,.15)}

#chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{
 display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
 background:var(--p);backdrop-filter:blur(10px);border:1px solid var(--l);
 font-size:12.5px;font-weight:500;cursor:pointer;user-select:none;transition:all .15s;
 box-shadow:0 4px 12px rgba(0,0,0,.3)
}
.chip:hover{border-color:#44546d}
.chip.off{opacity:.38;filter:grayscale(.8)}
.chip b{font-weight:700;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.08);font-size:11.5px}

/* ПЛАВАЮЧА КАРТКА ОБРАНОЇ ЦІЛІ / ЛІНІЙКИ */
#infocard{
 display:none;padding:11px 14px;border-radius:14px;background:var(--p);
 backdrop-filter:blur(14px);border:1px solid var(--l);box-shadow:0 8px 28px rgba(0,0,0,.55);
 max-width:440px;position:relative
}
#infocard .close{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--m);font-size:16px;cursor:pointer}

/* БОКОВІ КНОПКИ ІНСТРУМЕНТІВ */
#btns{position:absolute;z-index:900;right:10px;bottom:calc(var(--sh) + 12px);display:flex;flex-direction:column;gap:7px;transition:bottom .2s ease}
.b{
 width:42px;height:42px;border-radius:13px;background:var(--p);backdrop-filter:blur(10px);
 border:1px solid var(--l);color:var(--t);font-size:17px;padding:0;cursor:pointer;
 box-shadow:0 4px 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:all .15s
}
.b:hover,.b.on{border-color:var(--ac);background:#1b273d;color:#79c0ff}

/* НИЖНЯ ПАНЕЛЬ З ВКЛАДКАМИ */
#sheet{
 position:absolute;left:0;right:0;bottom:0;height:var(--sh);background:var(--p);
 backdrop-filter:blur(16px);border-top:1px solid var(--l);display:flex;flex-direction:column;
 padding-bottom:env(safe-area-inset-bottom);transition:height .2s ease;z-index:910
}
#grip{height:18px;display:flex;justify-content:center;align-items:center;cursor:pointer}#grip i{width:42px;height:4px;border-radius:4px;background:#303d52}
#tabs{display:flex;gap:14px;padding:0 14px 8px;border-bottom:1px solid var(--l);color:var(--m);font-weight:600;align-items:center;overflow-x:auto}
#tabs b{cursor:pointer;padding-bottom:6px;margin-bottom:-9px;white-space:nowrap;font-size:13px;transition:color .15s}
#tabs b.on{color:#fff;border-bottom:2px solid var(--ac)}
#simbox{display:flex;gap:6px;padding:8px 14px;background:rgba(11,15,23,.5);border-bottom:1px solid var(--l)}
#simin{flex:1;background:#0b0f17;border:1px solid var(--l);color:var(--t);border-radius:9px;padding:7px 11px;font-size:13px;outline:none}
#simin:focus{border-color:var(--ac)}
#simbtn{background:var(--ac);border:0;color:#fff;border-radius:9px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:12.5px}
#clrbtn{background:var(--p2);border:1px solid var(--l);color:var(--m);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:12.5px}
.pane{overflow:auto;flex:1;padding:4px 14px 12px}
.r{padding:10px 0;border-bottom:1px solid rgba(35,46,66,.65);cursor:pointer;transition:background .12s}
.r:hover{background:rgba(255,255,255,.02)}
.r small{display:block;color:var(--m);margin-top:2px;font-size:12px}
.r .tx{color:#b1bac4;margin-top:3px;font-size:12.5px}
.k{display:inline-block;padding:1px 7px;border-radius:99px;border:1px solid;font-size:11px;margin-right:5px;font-weight:600}
.ch-b{display:inline-block;padding:1px 6px;border-radius:5px;background:#2ea04326;border:1px solid #3fb95066;color:#56d364;font-size:10.5px;margin-left:5px}
.st-b{display:inline-block;padding:1px 6px;border-radius:5px;background:#f8514926;border:1px solid #f8514988;color:#ff7b72;font-size:11px;font-weight:600;margin-left:5px}
.conf-b{display:inline-block;padding:1px 6px;border-radius:5px;background:#388bfd22;border:1px solid #388bfd55;color:#79c0ff;font-size:10.5px;margin-left:5px}
.del-b{float:right;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#ff7b72;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer}
.del-b:hover{background:rgba(248,81,73,.28)}

/* НАЛАШТУВАННЯ ШАРІВ ТА КАНАЛІВ */
.sw-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(35,46,66,.6)}
.sw-row label{font-weight:500;cursor:pointer}
.sw-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);cursor:pointer}
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 12px}
.st-card{padding:9px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--l);cursor:pointer;text-align:center;font-weight:600;font-size:12.5px}
.st-card.on{border-color:var(--ac);background:#1b273d;color:#79c0ff}

/* МАРКЕРИ НА КАРТІ */
.mk{position:relative;width:28px;height:28px}
.mk svg{width:28px;height:28px;filter:drop-shadow(0 0 4px rgba(0,0,0,.9))}
.lb{
 position:absolute;left:26px;top:2px;white-space:nowrap;font:600 11px/1.2 system-ui,sans-serif;
 color:var(--c);background:rgba(11,15,23,.82);padding:2px 6px;border-radius:5px;
 border:1px solid rgba(255,255,255,.12);box-shadow:0 2px 6px rgba(0,0,0,.5)
}
.pulse{position:absolute;inset:-6px;border:2px solid var(--c);border-radius:50%;animation:pu 1.3s infinite}
@keyframes pu{from{transform:scale(.45);opacity:1}to{transform:scale(1.65);opacity:0}}
.ring{font:600 10.5px system-ui;color:#586982;white-space:nowrap;text-shadow:0 0 3px #000}
.tgt-reticle{width:14px;height:14px;border:2px solid var(--c);border-radius:50%;position:relative;box-shadow:0 0 6px #000}
.tgt-reticle::after{content:'';position:absolute;inset:3px;background:var(--c);border-radius:50%}

#al{position:absolute;z-index:1000;inset:0;display:none;background:radial-gradient(#8a111dee,#330408f5);text-align:center;padding:24% 24px;font-size:24px;font-weight:700}
#al button{margin-top:28px;padding:12px 28px;border-radius:12px;border:0;font-size:17px;font-weight:700;background:#fff;color:#400;cursor:pointer}
</style></head><body>
<div id="m"></div>

<div id="hud">
 <div id="ban"><span id="bantx">🟢 Підключення до моніторингу…</span><span id="clock">--:--:--</span></div>
 <div id="chips"></div>
 <div id="infocard"><button class="close" onclick="$('infocard').style.display='none';clearRuler()">✖</button><div id="infobody"></div></div>
</div>

<div id="btns">
 <button class="b" id="bs" title="Звукова сирена та голосове сповіщення">🔔</button>
 <button class="b" id="brul" title="Лінійка підльоту (виміряти відстань і час до Запоріжжя)">📏</button>
 <button class="b" id="bm" title="Моя геолокація">📍</button>
 <button class="b" id="bh" title="Центрувати на Запоріжжі">🎯</button>
 <button class="b" id="bl" title="Перемкнути карту">🗺</button>
</div>

<div id="sheet">
 <div id="grip"><i></i></div>
 <div id="tabs">
  <b class="on" data-t="list">🎯 Цілі <span id="tcnt"></span></b>
  <b data-t="feed">📡 Стрічка</b>
  <b data-t="layers">🎛 Шари та Карта</b>
  <b data-t="chans">⚙️ Канали</b>
 </div>
 <div id="simbox">
  <input id="simin" placeholder="Перевірити текст сводки (напр.: КАБи з-під Пришиба на Розумівку)">
  <button id="simbtn">На карту</button>
  <button id="clrbtn" title="Очистити всі мітки">Очистити</button>
 </div>
 <div id="list" class="pane"></div>
 <div id="feed" class="pane" hidden></div>
 <div id="layers" class="pane" hidden>
  <div style="font-weight:600;margin:6px 0">Стиль карти</div>
  <div class="style-grid">
   <div class="st-card on" data-map="dk">🌑 Темний радар</div>
   <div class="st-card" data-map="oled">🖤 OLED Контраст</div>
   <div class="st-card" data-map="st">🛰 Супутник Esri</div>
   <div class="st-card" data-map="lt">🗺 Світла карта</div>
  </div>
  <div class="sw-row"><label for="sw_cone">Конуси сектору загрози (±18° за курсом)</label><input type="checkbox" id="sw_cone" checked></div>
  <div class="sw-row"><label for="sw_front">Лінія фронту (ЛБЗ) на півдні області</label><input type="checkbox" id="sw_front" checked></div>
  <div class="sw-row"><label for="sw_unc">Кола радіусу неточності координат</label><input type="checkbox" id="sw_unc" checked></div>
  <div class="sw-row"><label for="sw_rings">Кільця дальності (20 / 45 / 70 / 90 км)</label><input type="checkbox" id="sw_rings" checked></div>
  <div class="sw-row"><label for="sw_conf">Показувати лише підтверджені (≥2 канали)</label><input type="checkbox" id="sw_conf"></div>
 </div>
 <div id="chans" class="pane" hidden>
  <div style="display:flex;gap:6px;margin:6px 0 10px">
   <input id="chanin" placeholder="Додати Telegram-канал (напр. @channel)" style="flex:1;background:#0b0f17;border:1px solid var(--l);color:var(--t);border-radius:8px;padding:6px 10px">
   <button id="chanbtn" style="background:var(--gn);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer">+ Додати</button>
  </div>
  <div id="chanlist"></div>
 </div>
</div>

<div id="al"><div id="at"></div><button onclick="stopAlarm()">Зрозуміло</button></div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K={
 drone:{n:'БпЛА',c:'#e3b341'},
 kab:{n:'КАБ',c:'#f85149'},
 missile:{n:'Ракета',c:'#ff8a3d'},
 strike:{n:'РСЗО/обстріл',c:'#d2a8ff'},
 impact:{n:'Приліт',c:'#ff5c5c'}
};
const ICONS={
 delta:c=>'<path d="M0-11L10 9L4 7L0 10L-4 7L-10 9Z"/>',
 decoy:c=>'<path d="M0-10L9 8L0 5L-9 8Z" fill-opacity=".45" stroke-dasharray="2 2"/>',
 jet:c=>'<path d="M0-12L1.8-5L11 8L11 10L2 7L1.2 10L3.5 12L-3.5 12L-1.2 10L-2 7L-11 10L-11 8L-1.8-5Z"/>',
 cruise:c=>'<path d="M0-12L1.6-7L1.6-2L10 3L10 5.5L1.6 3.5L1.6 8L4.5 10.5L4.5 12L0 11L-4.5 12L-4.5 10.5L-1.6 8L-1.6 3.5L-10 5.5L-10 3L-1.6-2L-1.6-7Z"/>',
 xwing:c=>'<path d="M-10-10L-6-10L0-4L6-10L10-10L10-6L4 0L10 6L10 10L6 10L0 4L-6 10L-10 10L-10 6L-4 0L-10-6Z"/>',
 flywing:c=>'<path d="M0-7L11 7L0 4L-11 7Z"/>',
 plane:c=>'<path d="M0-10L1.6-4L10-1.5L10 1.5L1.6 .5L1.2 6L5 8L5 10L0 9L-5 10L-5 8L-1.2 6L-1.6 .5L-10 1.5L-10-1.5L-1.6-4Z"/>',
 quad:c=>`<path d="M-6-6L6 6M6-6L-6 6" fill="none" stroke="${c}" stroke-width="2.2"/><circle cx="-7" cy="-7" r="3"/><circle cx="7" cy="-7" r="3"/><circle cx="-7" cy="7" r="3"/><circle cx="7" cy="7" r="3"/>`,
 kab:c=>'<path d="M0-11L2.2-4L9 2L9 4.5L2.2 2.5L1.8 8.5L5 11L-5 11L-1.8 8.5L-2.2 2.5L-9 4.5L-9 2L-2.2-4Z"/>',
 missile:c=>'<path d="M0-12L3.5 8L0 5L-3.5 8Z"/>',
 dart:c=>'<path d="M0-13L2.5 4L0 2L-2.5 4Z"/><path d="M0 5L1.8 11L0 9.5L-1.8 11Z" fill-opacity=".6"/>',
 ballistic:c=>'<path d="M0-12L3 5L0 3L-3 5Z"/><path d="M0 6L2.2 12L0 10L-2.2 12Z" fill-opacity=".55"/>',
 star:c=>'<path d="M0-9L2-3L8-4L3 0L6 7L0 4L-6 7L-3 0L-8-4L-2-3Z"/>'
};
const NOROT=new Set(['star','quad']);
const map=L.map('m',{zoomControl:false}).fitBounds([[46.7,34.3],[48.2,36.6]]);
const TILES={
 dk:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,className:'dk',attribution:'© OpenStreetMap'}),
 oled:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,className:'oled',attribution:'© OpenStreetMap'}),
 lt:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}),
 st:L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,className:'st',attribution:'© Esri'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,className:'st'})
 ])
};
let curMapKey='dk',base=TILES.dk.addTo(map),D={tracks:[],feed:[],home:null},snapT=performance.now(),hidden=new Set(),objs={},ringsGrp=L.layerGroup().addTo(map),frontGrp=L.layerGroup().addTo(map),ringsOk=0,oblOk=0,frontOk=0,me=null,meMk=null,actx,alarmT,soundOn=false,rulerOn=false,rulerLayer=L.layerGroup().addTo(map);
const CFG={cone:true,front:true,unc:true,rings:true,confOnly:false};

setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);
const fmt=s=>s>=60?Math.floor(s/60)+' хв '+(s%60?s%60+' с':''):s+' с';
function hav(a,b,c,d){const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function brg(a,b,c,d){const p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p),x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function fwdPt(la,lo,hDeg,km){const r=hDeg*Math.PI/180;return[la+km*Math.cos(r)/111.2,lo+km*Math.sin(r)/(111.2*Math.cos(la*Math.PI/180))]}

function conePts(la,lo,hdg,distKm,halfDeg=16){
 const pts=[[la,lo]];
 for(let a=-halfDeg;a<=halfDeg;a+=4)pts.push(fwdPt(la,lo,(hdg+a+360)%360,distKm));
 pts.push([la,lo]);
 return pts;
}

function ext(t,dt){
 if(!t.v||t.ended||t.hdg==null)return{pos:[t.lat,t.lon],hdg:t.hdg||0};
 dt=Math.min(dt,2.5);
 const lim=t.eta!=null?Math.max(0,Math.min(dt,t.eta)):dt;
 const hdg=t.goal?brg(t.lat,t.lon,t.goal[0],t.goal[1]):t.hdg;
 const km=t.v*lim/3600,h=hdg*Math.PI/180;
 return{pos:[t.lat+km*Math.cos(h)/111.2,t.lon+km*Math.sin(h)/(111.2*Math.cos(t.lat*Math.PI/180))],hdg};
}

function initRings(h){
 [20,45,70,90].forEach(r=>{
  L.circle([h[1],h[2]],{radius:r*1000,color:'#2d394d',weight:1,dashArray:'4 6',fill:false,interactive:false}).addTo(ringsGrp);
  L.marker([h[1]+r/111.2,h[2]],{interactive:false,icon:L.divIcon({className:'',html:`<span class="ring">${r} км</span>`,iconSize:[42,14],iconAnchor:[21,7]})}).addTo(ringsGrp);
 });
 L.circleMarker([h[1],h[2]],{radius:6,color:'#3fb950',weight:2,fillColor:'#2ea043',fillOpacity:.95}).addTo(map).bindTooltip(h[0]);
}

function icon(t,hdgOvr){
 const c=(t.ended?'#8b949e':t.col||K[t.kind]?.c||'#e3b341'),cnt=t.cnt?' ×'+t.cnt:'',chN=(t.chs&&t.chs.length)||t.n||1;
 const lab=[(t.name||K[t.kind]?.n||'Ціль')+cnt,t.status?t.status:(t.hdg==null&&!t.ended?'над '+t.frm+' (очікує курс)':(t.v?t.v+' км/г':'')),t.alt!=null?t.alt+' м':'',t.eta>0&&!t.ended?fmt(t.eta):''].filter(Boolean).join(' · ');
 const g=(ICONS[t.ico]||ICONS.delta)(c),fast=!t.ended&&(t.kind=='kab'||t.v>=500||(t.hdg==null&&t.kind=='drone')),rot=NOROT.has(t.ico)||t.hdg==null?0:(hdgOvr??t.hdg),op=t.ended?.65:1;
 return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,14],html:`<div class="mk" style="--c:${c};opacity:${op}">${fast?'<i class="pulse"></i>':''}<svg viewBox="-13 -13 26 26" style="transform:rotate(${rot}deg)"><g fill="${c}" stroke="#080b10" stroke-width="1.3" stroke-linejoin="round">${g}</g></svg><span class="lb">${esc(lab)}</span></div>`});
}

function showTargetInfo(t){
 const chs=t.chs&&t.chs.length?t.chs.join(', '):'1 джерело';
 $('infobody').innerHTML=`
  <div style="font-weight:700;font-size:14.5px;color:${t.col};margin-bottom:4px">${esc(t.name)}${t.cnt?' ×'+t.cnt:''} <span class="conf-b">точність ${t.conf||70}%</span></div>
  <div style="font-size:12.5px;color:var(--t)">Маршрут: <b>${esc(t.frm)}</b>${t.to?' → <b>'+esc(t.to)+'</b>':' (очікує вектор)'}</div>
  <div style="font-size:12px;color:var(--m);margin-top:3px">Швидкість: ${t.v?t.v+' км/год':'0 км/год'} · Курс: ${t.hdg!=null?t.hdg+'°':'кружляє'} · До Запоріжжя: <b>${t.home} км</b>${t.eta?' (~'+fmt(t.eta)+')':''}</div>
  <div style="font-size:11.5px;color:#56d364;margin-top:3px">Джерела (${t.n}): ${esc(chs)}</div>
  <div style="font-size:12px;color:#b1bac4;margin-top:5px;padding:6px 8px;background:#0b0f17;border-radius:8px">${esc(t.text)}</div>
  <div style="margin-top:8px;display:flex;gap:8px">
   <button onclick="dismissTrack(${t.id})" style="background:#f8514922;border:1px solid #f8514966;color:#ff7b72;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer">✖ Прибрати хибну мітку</button>
  </div>`;
 $('infocard').style.display='block';
}

async function dismissTrack(id){
 $('infocard').style.display='none';
 await fetch('/sim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dismiss:id})});
}

function visibleTracks(){
 return (D.tracks||[]).filter(t=>!hidden.has(t.kind)&&(!CFG.confOnly||((t.chs&&t.chs.length>=2)||t.n>=2)));
}

function render(d){
 D=d;snapT=performance.now();
 if(!ringsOk&&d.home){initRings(d.home);ringsOk=1}
 if(!oblOk&&d.oblast){L.polygon(d.oblast,{color:'#3b4c66',weight:1.5,fill:false,dashArray:'3 6',interactive:false}).addTo(map);oblOk=1}
 if(!frontOk&&d.frontline){
  L.polyline(d.frontline,{color:'#f85149',weight:2.2,opacity:.65,dashArray:'8 6',interactive:false}).addTo(frontGrp).bindTooltip('Лінія бойового зіткнення (ЛБЗ)');
  frontOk=1;
 }
 const vTracks=visibleTracks(),ids=new Set();
 for(const t of vTracks){
  ids.add(t.id);let o=objs[t.id];const c=t.col||K[t.kind]?.c||'#e3b341';
  if(!o){
   o={
    g:L.layerGroup().addTo(map),
    mk:L.marker([t.lat,t.lon],{icon:icon(t),keyboard:false}),
    cone:L.polygon([],{color:c,weight:0,fillColor:c,fillOpacity:.13,interactive:false}),
    tr:L.polyline([],{color:c,weight:1.5,opacity:.38}),
    ln:L.polyline([],{color:c,weight:2,opacity:.85,dashArray:'6 6'}),
    ret:L.marker([t.lat,t.lon],{interactive:false,opacity:0,icon:L.divIcon({className:'',html:`<div class="tgt-reticle" style="--c:${c}"></div>`,iconSize:[14,14],iconAnchor:[7,7]})}),
    un:L.circle([t.lat,t.lon],{radius:0,color:c,weight:1,opacity:.4,fillOpacity:.07,interactive:false})
   };
   o.mk.on('click',()=>showTargetInfo(o.t));
   o.g.addLayer(o.un).addLayer(o.cone).addLayer(o.tr).addLayer(o.ln).addLayer(o.ret).addLayer(o.mk);
   objs[t.id]=o;
  }
  o.t=t;o.mk.setIcon(icon(t));
  o.un.setRadius(CFG.unc?(t.ended?400:t.unc*1000):0);
  if(t.goal&&!t.ended&&t.kind!='strike'){o.ret.setLatLng(t.goal);o.ret.setOpacity(.9)}else{o.ret.setOpacity(0)}
 }
 for(const id in objs)if(!ids.has(+id)){objs[id].g.remove();delete objs[id]}
 chips();banner();list();feed();renderChans();tick();
}

function tick(){
 const dt=(performance.now()-snapT)/1000;
 for(const id in objs){
  const o=objs[id],t=o.t,st=ext(t,dt),p=st.pos;
  o.mk.setLatLng(p);o.un.setLatLng(p);
  o.tr.setLatLngs(t.fx&&t.fx.length>1&&!t.ended?[t.fx[0],p]:[]);
  o.ln.setLatLngs(t.goal&&!t.ended&&t.kind!='strike'?[p,t.goal]:[]);
  if(CFG.cone&&!t.ended&&t.hdg!=null&&t.v>0){
   const cDist=t.goal?Math.min(18,Math.max(4,hav(p[0],p[1],t.goal[0],t.goal[1]))):10;
   o.cone.setLatLngs(conePts(p[0],p[1],st.hdg,cDist,t.kind=='kab'?11:18));
  }else{o.cone.setLatLngs([])}
  if(!NOROT.has(t.ico)&&t.hdg!=null){const el=o.mk.getElement();const svg=el&&el.querySelector('svg');if(svg)svg.style.transform=`rotate(${st.hdg.toFixed(1)}deg)`}
 }
}
setInterval(tick,50);

function chips(){
 const c={};D.tracks.forEach(t=>{if(!t.ended)c[t.kind]=(c[t.kind]||0)+1});
 const actCnt=D.tracks.filter(t=>!t.ended).length;
 $('tcnt').textContent=actCnt?`(${actCnt})`:'';
 $('chips').innerHTML=`<span class="chip" id="st">${$('chips').dataset.s||'● онлайн'}</span>`+
  Object.keys(K).map(k=>`<span class="chip${hidden.has(k)?' off':''}" data-k="${k}" style="border-color:${K[k].c}66"><i style="width:8px;height:8px;border-radius:50%;background:${K[k].c};display:inline-block"></i>${K[k].n} <b>${c[k]||0}</b></span>`).join('');
}
$('chips').onclick=e=>{const el=e.target.closest('.chip');const k=el&&el.dataset.k;if(k){hidden.has(k)?hidden.delete(k):hidden.add(k);render(D)}};

function banner(){
 const b=$('ban'),tx=$('bantx'),h=D.home;if(!h)return;
 const kabs=D.tracks.filter(t=>t.kind=='kab'&&!t.ended&&!t.short&&t.goal&&hav(t.goal[0],t.goal[1],h[1],h[2])<25);
 if(kabs.length){const t=kabs.sort((a,b)=>(a.eta??1e9)-(b.eta??1e9))[0];b.className='rd';tx.textContent=`🚨 КАБ на ${h[0]} (пуск: ${t.frm}) · ${t.home} км${t.eta!=null?' · ~'+fmt(t.eta):''} · ${t.alt} м`;return}
 const dr=D.tracks.filter(t=>t.kind!='strike'&&t.kind!='impact'&&!t.ended);
 if(dr.length){
  const n=dr.slice().sort((a,b)=>a.home-b.home)[0],th=dr.filter(t=>t.etah!=null).sort((a,b)=>a.etah-b.etah)[0];
  b.className='am';
  tx.textContent=th?`⚠️ ${th.name}${th.cnt?' ×'+th.cnt:''} курсом на ${h[0]} · ${th.home} км · ~${fmt(th.etah)}`:`🟡 Активних цілей: ${dr.length} · найближча ${n.name}${n.cnt?' ×'+n.cnt:''} (${n.frm}${n.to?' → '+n.to:''}) — ${n.home} км до ${h[0]}`;
 }else{b.className='';tx.textContent='🟢 Спокійно: у повітряному просторі Запорізької обл. активних цілей немає'}
}

function list(){
 const rows=visibleTracks().sort((a,b)=>(a.ended?1:0)-(b.ended?1:0)||(a.kind=='kab'?0:1)-(b.kind=='kab'?0:1)||a.home-b.home);
 $('list').innerHTML=rows.map(t=>{
  const e=t.eta>0?t.eta:t.etah,chs=t.chs&&t.chs.length?t.chs:[];
  return`<div class="r" data-id="${t.id}">
   <button class="del-b" onclick="event.stopPropagation();dismissTrack(${t.id})" title="Прибрати мітку">✖</button>
   <b style="color:${t.ended?'#8b949e':t.col}">${esc(t.name)}${t.cnt?' ×'+t.cnt:''}</b>
   ${t.status?`<span class="st-b">${esc(t.status)}</span>`:''}
   ${chs.length>1?`<span class="ch-b">✓ ${chs.length} кан.</span>`:''}
   <span class="conf-b">${t.conf||70}%</span>
   <span style="margin-left:4px">${esc(t.frm)}${t.to?' → <b>'+esc(t.to)+'</b>':''}</span>
   <small>${t.hdg!=null&&!t.ended?'курс '+t.hdg+'° · ':(!t.ended?'кружляє / очікує уточнення курсу · ':'')}${t.v&&!t.ended?t.v+' км/год · ':''}${t.alt!=null?'висота ~'+t.alt+' м · ':''}похибка ±${t.unc} км${chs.length?' · джерела: '+esc(chs.join(', ')):''}</small>
   <small>до ${esc(D.home[0])}: <b>${t.home} км</b>${e!=null&&!t.ended?' · підліт ~<b>'+fmt(e)+'</b>'+(t.eta>0?'':' (за вектором)'):''}${me?' · до вас '+hav(me[0],me[1],t.lat,t.lon).toFixed(1)+' км':''} · оновлено ${t.age} с тому</small>
   <div class="tx">${esc(t.text)}</div>
  </div>`;
 }).join('')||'<div class="r" style="text-align:center;color:var(--m);padding:24px 0">Активних повітряних цілей у Запорізькій області наразі немає</div>';
}
$('list').onclick=e=>{const r=e.target.closest('.r');if(r&&objs[r.dataset.id]){const o=objs[r.dataset.id];map.flyTo(o.mk.getLatLng(),11);showTargetInfo(o.t)}};

function feed(){
 $('feed').innerHTML=(D.feed||[]).map(f=>`<div class="r"><small>${new Date(f.t*1000).toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · <b>@${esc(f.ch)}</b></small><div class="tx">${esc(f.text)}</div>${f.kinds.map(k=>K[k]?`<span class="k" style="color:${K[k].c}">${K[k].n}</span>`:'').join('')}<small style="display:inline">${esc(f.place)}</small></div>`).join('')||'<div class="r" style="color:var(--m)">Стрічка подій порожня</div>';
}

function renderChans(){
 if(!D.channels)return;
 $('chanlist').innerHTML=D.channels.map(c=>`<div class="r" style="cursor:default"><b style="color:${c.ok?'#56d364':'#f85149'}">● @${esc(c.name)}</b> <small style="display:inline;margin-left:6px">опитано о ${esc(c.checked)}</small><small class="tx">${esc(c.last||'Очікування нових повідомлень…')}</small></div>`).join('');
}

$('tabs').onclick=e=>{
 const b=e.target.closest('b');if(!b)return;
 const t=b.dataset.t;
 [...$('tabs').querySelectorAll('b')].forEach(x=>x.classList.toggle('on',x===b));
 ['list','feed','layers','chans'].forEach(id=>$(id).hidden=(id!==t));
};
$('grip').onclick=()=>{const r=document.documentElement.style;r.setProperty('--sh',r.getPropertyValue('--sh')=='52px'?'42%':'52px');setTimeout(()=>map.invalidateSize(),220)};
$('bh').onclick=()=>D.home&&map.flyTo([D.home[1],D.home[2]],10);

function setMapStyle(k){
 if(!TILES[k])return;
 map.removeLayer(base);base=TILES[k];base.addTo(map);curMapKey=k;
 [...document.querySelectorAll('.st-card')].forEach(c=>c.classList.toggle('on',c.dataset.map===k));
}
$('bl').onclick=()=>{const order=['dk','oled','st','lt'];setMapStyle(order[(order.indexOf(curMapKey)+1)%order.length])};
document.querySelector('.style-grid').onclick=e=>{const c=e.target.closest('.st-card');if(c)setMapStyle(c.dataset.map)};

$('sw_cone').onchange=e=>{CFG.cone=e.target.checked;tick()};
$('sw_front').onchange=e=>{CFG.front=e.target.checked;CFG.front?frontGrp.addTo(map):map.removeLayer(frontGrp)};
$('sw_unc').onchange=e=>{CFG.unc=e.target.checked;render(D)};
$('sw_rings').onchange=e=>{CFG.rings=e.target.checked;CFG.rings?ringsGrp.addTo(map):map.removeLayer(ringsGrp)};
$('sw_conf').onchange=e=>{CFG.confOnly=e.target.checked;render(D)};

/* ІНСТРУМЕНТ ЛІНІЙКА ПІДЛЬОТУ (📏) */
function clearRuler(){rulerLayer.clearLayers()}
$('brul').onclick=()=>{
 rulerOn=!rulerOn;$('brul').classList.toggle('on',rulerOn);
 if(!rulerOn){clearRuler();$('infocard').style.display='none'}
 else{
  $('infobody').innerHTML='<b>📏 Лінійка підльоту:</b> торкніться будь-якої точки на карті, щоб розрахувати відстань і час підльоту Шахеда, КАБа та Балістики до Запоріжжя.';
  $('infocard').style.display='block';
 }
};
map.on('click',e=>{
 if(!rulerOn||!D.home)return;
 clearRuler();
 const p=[e.latlng.lat,e.latlng.lng],ref=me||[D.home[1],D.home[2]],refName=me?'Вашої геопозиції':D.home[0];
 const dKm=hav(p[0],p[1],ref[0],ref[1]),bDeg=Math.round(brg(p[0],p[1],ref[0],ref[1]));
 L.circleMarker(p,{radius:5,color:'#58a6ff',fillColor:'#58a6ff',fillOpacity:1}).addTo(rulerLayer);
 L.polyline([p,ref],{color:'#58a6ff',weight:2,dashArray:'5 5'}).addTo(rulerLayer);
 const tShahed=Math.round(dKm/175*3600),tKab=Math.round(dKm/660*3600),tBal=Math.round(dKm/4500*3600);
 $('infobody').innerHTML=`
  <div style="font-weight:700;color:#79c0ff;margin-bottom:4px">📏 Розрахунок підльоту до ${esc(refName)}</div>
  <div>Відстань: <b>${dKm.toFixed(1)} км</b> · Азимут на ціль: <b>${bDeg}°</b></div>
  <div style="margin-top:5px;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
   <span>🛵 Шахед (175 км/г): <b>~${fmt(tShahed)}</b></span>
   <span>💣 КАБ (660 км/г): <b>~${fmt(tKab)}</b></span>
   <span>🚀 Крилата (850 км/г): <b>~${fmt(Math.round(dKm/850*3600))}</b></span>
   <span>⚡ Балістика (4500 км/г): <b>~${fmt(tBal)}</b></span>
  </div>`;
 $('infocard').style.display='block';
});

$('bm').onclick=()=>navigator.geolocation&&navigator.geolocation.watchPosition(p=>{
 me=[p.coords.latitude,p.coords.longitude];
 if(!meMk)meMk=L.circleMarker(me,{radius:7,color:'#fff',fillColor:'#2f81f7',fillOpacity:1,weight:2}).addTo(map).bindTooltip('Ви');
 meMk.setLatLng(me);list();
},()=>{},{enableHighAccuracy:true});

async function sendSim(){const inp=$('simin'),tx=inp.value.trim();if(!tx)return;inp.value='';
 await fetch('/sim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:tx})})}
$('simbtn').onclick=sendSim;$('simin').onkeydown=e=>{if(e.key==='Enter')sendSim()};
$('clrbtn').onclick=()=>fetch('/sim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clear:true})});
$('chanbtn').onclick=async()=>{
 const inp=$('chanin'),v=inp.value.trim();if(!v)return;inp.value='';
 await fetch('/sim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({add_channel:v})});
};

function beep(){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=900;o.connect(g);g.connect(actx.destination);g.gain.value=.4;o.start();o.frequency.setValueAtTime(600,actx.currentTime+.25);o.stop(actx.currentTime+.5)}
function alarm(a){$('at').textContent='⚠️ '+a.text;$('al').style.display='block';clearInterval(alarmT);beep();alarmT=setInterval(beep,700);navigator.vibrate&&navigator.vibrate([500,200,500,200,800]);
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Увага! КАБ летить на Запоріжжя. '+(a.lvl==2?'Негайно в укриття!':''));u.lang='uk-UA';speechSynthesis.speak(u);
 if(window.Notification&&Notification.permission=='granted')new Notification('КАБ на Запоріжжя',{body:a.text,requireInteraction:true})}
function stopAlarm(){clearInterval(alarmT);speechSynthesis.cancel();$('al').style.display='none'}
$('bs').onclick=async()=>{if(!soundOn){soundOn=true;actx=new(window.AudioContext||window.webkitAudioContext)();beep();speechSynthesis.speak(new SpeechSynthesisUtterance(' '));window.Notification&&Notification.requestPermission();
  try{await navigator.wakeLock.request('screen')}catch(_){}$('bs').textContent='🔊';$('bs').title='Тест сирени'}else alarm({text:'ТЕСТ: КАБ на Запоріжжя',lvl:1})};

function connect(){const es=new EventSource('/events');
 es.onopen=()=>{$('chips').dataset.s='● онлайн';chips()};
 es.onmessage=e=>{$('chips').dataset.s='● онлайн';render(JSON.parse(e.data))};
 es.addEventListener('alert',e=>alarm(JSON.parse(e.data)));
 es.onerror=()=>{$('chips').dataset.s='✖ немає зв\'язку';chips();$('ban').className='am';$('bantx').textContent='Немає зв\'язку з сервером — перепідключення…'}}
connect();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
